name: Validate community contributions

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Schema and validator checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the dependency-free validator
        run: npm test

      - name: Validate contribution records
        run: npm run validate
