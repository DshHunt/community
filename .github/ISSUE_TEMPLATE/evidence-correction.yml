name: Evidence correction
description: Correct a published evidence record
title: "[Evidence correction]: "
labels:
  - evidence-correction
body:
  - type: markdown
    attributes:
      value: |
        This GitHub Issue will be public. Corrections must be supported by original, publicly verifiable evidence. Do not include secrets, private source code, or sensitive vulnerability details.
  - type: input
    id: dsh-hunt-page-url
    attributes:
      label: DSH Hunt Page URL
      placeholder: https://dshhunt.com/plugins/example
    validations:
      required: true
  - type: input
    id: report-id
    attributes:
      label: Report ID
      description: Stable identity formatted as packageId:evidenceId:commitSha when supplied by a DSH Hunt page.
      placeholder: packageId:evidenceId:commitSha
  - type: input
    id: finding-id
    attributes:
      label: Finding ID / Field Key
      description: Use the stable public field key supplied by the page when available; otherwise name the field below.
      placeholder: licenses.package.value
  - type: input
    id: incorrect-field
    attributes:
      label: Incorrect Field
      description: Name the exact public field that should be corrected. If the page shows a stable field key such as licenses.package.value, include it here.
    validations:
      required: true
  - type: textarea
    id: current-value
    attributes:
      label: Current Displayed Value
      description: Copy only the value currently shown on DSH Hunt.
    validations:
      required: true
  - type: textarea
    id: proposed-value
    attributes:
      label: Proposed Value
      description: State the replacement value and explain the correction briefly.
    validations:
      required: true
  - type: textarea
    id: original-source
    attributes:
      label: Original Source
      description: Link directly to the public primary source supporting the correction.
      placeholder: https://github.com/owner/repository/blob/commit/path/to/file
    validations:
      required: true
  - type: input
    id: fixed-commit
    attributes:
      label: Fixed Commit
      description: Provide the full commit SHA for repository evidence whenever possible.
      placeholder: 40-character commit SHA
  - type: textarea
    id: maintainer-identity
    attributes:
      label: Maintainer Identity Statement
      description: State whether you are a maintainer, contributor, user, or unrelated reporter. Do not include private contact details.
    validations:
      required: true
