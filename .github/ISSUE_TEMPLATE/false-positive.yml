name: False-positive appeal
description: Report a project incorrectly identified as a plugin
title: "[False positive]: "
labels:
  - false-positive
body:
  - type: markdown
    attributes:
      value: |
        This GitHub Issue will be public. Provide public, verifiable evidence only. Do not include secrets, private source code, or sensitive vulnerability details.
  - type: input
    id: repository-url
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: fixed-commit-sha
    attributes:
      label: Fixed Commit SHA
      description: Include the full SHA shown on the DSH Hunt report when disputing that report. A newer source revision is a separate update and does not change what the pinned report observed.
      placeholder: 40-character commit SHA
  - type: dropdown
    id: false-positive-type
    attributes:
      label: False-positive Type
      options:
        - Not a plugin
        - Wrong project or repository
        - Fork or mirror counted separately
        - Example, template, or archived project
        - Other
    validations:
      required: true
  - type: input
    id: actual-project-type
    attributes:
      label: Actual Project Type
      description: Describe what the project actually is.
    validations:
      required: true
  - type: textarea
    id: exclusion-reason
    attributes:
      label: Exclusion Reason
      description: Explain why the project should be excluded from plugin results.
    validations:
      required: true
  - type: textarea
    id: supporting-evidence
    attributes:
      label: Supporting Evidence
      description: Link to public, primary evidence at the pinned revision supporting the appeal. Do not substitute a later revision for evidence about the published report.
    validations:
      required: true
